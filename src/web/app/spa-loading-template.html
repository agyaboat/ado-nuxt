<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdoNuxt Loader</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }

      .loader-wrapper {
        text-align: center;
      }

      .spinner {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        border: 4px dashed #eab308;
        border-radius: 9999px;
        animation: spin 1s linear infinite;
      }

      .title {
        margin-top: 16px;
        color: #18181b;
        font-size: 24px;
        font-weight: 600;
      }

      .subtitle {
        margin-top: 8px;
        color: #52525b;
        font-size: 16px;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
        }

        .title {
          color: #ffffff;
        }

        .subtitle {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-wrapper">
      <div class="spinner"></div>
      <h2 class="title">Loading...</h2>
      <p class="subtitle">Your adventure is about to begin</p>
    </div>
  </body>
</html>
